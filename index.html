<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Sign in to your Account</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="screen" id="login-screen">
    <div class="bg-gradient"></div>

    <header class="status-row" aria-hidden="true">
      <span class="time">12:45</span>
      <span class="status-icons">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </span>
    </header>

    <section class="hero">
      <h1 class="title">Sign in to your<br/>Account</h1>
      <p class="subtitle">Please enter your credentials to continue</p>
    </section>

    <form class="form" id="login-form" novalidate>
      <label class="field">
        <span class="field-label">Email</span>
        <input
          type="email"
          name="email"
          id="email"
          autocomplete="email"
          inputmode="email"
          placeholder="abhi.xyz@gmail.com"
          required
        />
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <div class="input-wrap">
          <input
            type="password"
            name="password"
            id="password"
            autocomplete="current-password"
            placeholder="••••••••"
            minlength="6"
            required
          />
          <button type="button" class="eye-btn" id="toggle-password" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </button>
        </div>
      </label>

      <a href="#" class="forgot">Forgot Password</a>

      <button type="submit" class="btn-primary" id="login-btn">Login</button>

      <div class="divider"><span>Or login with</span></div>

      <div class="social-row">
        <button type="button" class="btn-social" data-provider="apple" aria-label="Continue with Apple">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor">
            <path d="M16.365 1.43c0 1.14-.46 2.23-1.21 3.03-.81.86-2.13 1.52-3.23 1.43-.13-1.1.43-2.27 1.16-3.05.83-.9 2.24-1.55 3.28-1.41zM20.5 17.4c-.55 1.27-.81 1.84-1.52 2.96-.99 1.55-2.39 3.49-4.13 3.5-1.55.02-1.95-1.01-4.05-1-2.1.01-2.54 1.02-4.09 1-1.74-.01-3.07-1.76-4.06-3.31C-.04 16.95-.34 11.86 1.6 9.18c1.39-1.94 3.58-3.07 5.64-3.07 2.1 0 3.42 1.15 5.16 1.15 1.69 0 2.71-1.15 5.14-1.15 1.84 0 3.78 1 5.16 2.73-4.54 2.49-3.8 8.96-2.2 8.56z"/>
          </svg>
          <span>Apple</span>
        </button>
        <button type="button" class="btn-social" data-provider="google" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#EA4335" d="M12 10.2v3.86h5.4c-.24 1.4-1.66 4.1-5.4 4.1-3.25 0-5.9-2.7-5.9-6.02s2.65-6.02 5.9-6.02c1.85 0 3.09.79 3.8 1.46l2.6-2.5C16.78 3.6 14.62 2.6 12 2.6 6.92 2.6 2.8 6.72 2.8 11.8s4.12 9.2 9.2 9.2c5.31 0 8.83-3.73 8.83-8.98 0-.6-.06-1.06-.15-1.52H12z"/>
            <path fill="#34A853" d="M12 21c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.78.54-1.83.92-3.12.92-2.4 0-4.43-1.62-5.16-3.8H3.9v2.39C5.4 18.94 8.45 21 12 21z"/>
            <path fill="#FBBC05" d="M6.84 13.74A5.4 5.4 0 0 1 6.55 12c0-.6.1-1.18.27-1.74V7.87H3.9A9 9 0 0 0 3 12c0 1.45.35 2.83.9 4.13l2.94-2.39z"/>
            <path fill="#4285F4" d="M12 6.6c1.32 0 2.5.46 3.43 1.36l2.57-2.57C16.46 3.94 14.42 3 12 3 8.45 3 5.4 5.06 3.9 7.87l2.94 2.39C7.57 8.22 9.6 6.6 12 6.6z"/>
          </svg>
          <span>Google</span>
        </button>
      </div>
    </form>

    <footer class="signup-row">
      <span>Don't have account?</span>
      <a href="#" id="register-link">Register</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
